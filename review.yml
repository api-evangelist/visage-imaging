actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface is documented, and Visage Imaging publishes no
    public API reference at all. The catalog entry was authored as an honest
    gated stub: five logically-modeled APIs (AI Open API, QA REST API, DICOMweb,
    HL7/FHIR, Viewer Launch) each marked endpointsModeled, with no fabricated
    OpenAPI, plans, rate-limits, or finops artifacts. No AsyncAPI document was
    created because there is no documented server-push transport on any public
    Visage surface to model.
