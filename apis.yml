name: Visage Imaging
kind: company
description: Visage Imaging is a global enterprise imaging vendor and a wholly-owned
  subsidiary of Pro Medicus Limited (ASX PME). Its flagship Visage 7 Enterprise Imaging
  Platform delivers server-side rendered images adaptively streamed to an intelligent
  zero-footprint thin-client viewer for diagnostic radiology, cardiology, and mobile
  reading, alongside Visage 7 Open Archive and the Visage AI Accelerator research
  platform. Interoperability is built on healthcare imaging standards - DICOM /
  DICOMweb, HL7, FHIR, and IHE profiles - and Visage exposes REST and open-API surfaces
  for AI algorithm integration and QA workflows. There is no public self-service
  developer portal; API access is partner- and customer-gated (Client Portal login,
  product documentation login, and an invitation-only AI Accelerator Program), so the
  API entries below are logically modeled from public product and release-note
  material rather than a published API reference.
