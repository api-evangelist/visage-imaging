  properties:
  - url: https://visageimaging.com/platform/acceleratedai/
    type: Documentation
  description: HL7 v2 messaging and FHIR-based interoperability for order/result and
    imaging-context exchange between Visage 7, the EHR, and RIS (including FHIR
    ImagingStudy / DiagnosticReport resources referenced by the AI Accelerator
