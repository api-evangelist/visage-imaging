    connected archives and modalities. Documented only in gated release notes and the
    Client Portal; endpoints and deployment-specific base URL are modeled, not published
    (endpointsModeled).
- aid: visage-imaging:visage-imaging-dicomweb-api
  name: Visage 7 DICOMweb API
  tags:
  - DICOMweb
  - DICOM
  - QIDO-RS
  - WADO-RS
  - STOW-RS
  - Studies
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://visageimaging.com/visage-7/
  properties:
  - url: https://visageimaging.com/visage-7/
    type: Documentation
  description: Standards-based DICOMweb interface for querying, retrieving, and storing
    imaging studies against the Visage 7 archive-neutral platform - QIDO-RS (query),
    WADO-RS / WADO-URI (retrieve), and STOW-RS (store). Base URL is per-deployment and
    the interface is not exposed through a public developer portal; surface is modeled
    from the DICOMweb standard and Visage's stated interoperability (endpointsModeled).
- aid: visage-imaging:visage-imaging-hl7-fhir-api
  name: Visage 7 HL7 / FHIR Interoperability API
  tags:
  - HL7
