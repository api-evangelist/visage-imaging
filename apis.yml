    type: Documentation
  description: Open API for integrating third-party and customer AI algorithms into the
    Visage 7 platform and Visage AI Accelerator research server, unifying research and
    diagnostic imaging. Publicly described as supporting FHIR, Python, NIfTI, webforms,
    2D/3D segmentations, semantic annotations, radiomics, bulk de-identification, and
    ground-truth labeling. Access is invitation-only via the Visage AI Accelerator
    Program; no public API reference is published, so endpoints are modeled from
    product material (endpointsModeled).
- aid: visage-imaging:visage-imaging-qa-rest-api
  name: Visage 7 QA REST API
  tags:
  - QA
  - Workflow
  - REST
  - Data Management
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://visageimaging.com/visage-7/
  properties:
  - url: https://visageimaging.com/visage-7/
    type: Documentation
  description: REST API introduced in Visage 7 release notes supporting a data-quality
